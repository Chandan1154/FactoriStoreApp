spring:
  application:
    name: factori-mobile-platform
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    url: ${MIGRATION_DATABASE_URL:${DATABASE_URL}}
    user: ${MIGRATION_DATABASE_USERNAME:${DATABASE_USERNAME}}
    password: ${MIGRATION_DATABASE_PASSWORD:${DATABASE_PASSWORD}}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

factori:
  template-root: ${FACTORY_TEMPLATE_ROOT:..}
  workspace-root: ${FACTORY_WORKSPACE_ROOT:${java.io.tmpdir}/factori-builds}
  artifact-root: ${FACTORY_ARTIFACT_ROOT:${java.io.tmpdir}/factori-artifacts}
  build-image: ${FACTORY_BUILD_IMAGE:}
  build-timeout-seconds: ${FACTORY_BUILD_TIMEOUT_SECONDS:900}
  build-queue-capacity: ${FACTORY_BUILD_QUEUE_CAPACITY:20}
  build-worker-threads: ${FACTORY_BUILD_WORKER_THREADS:2}
